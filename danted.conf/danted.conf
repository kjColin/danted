# 日志文件
logoutput: stderr

# 定义代理运行的用户和组
user.privileged: root
user.unprivileged: nobody
internal: 104.195.0.66 port = 1080
external: 104.195.0.66

internal: 104.195.0.67 port = 1081
external: 104.195.0.67

internal: 104.195.0.68 port = 1082
external: 104.195.0.68

internal: 104.195.0.69 port = 1083
external: 104.195.0.69

internal: 104.195.0.70 port = 1084
external: 104.195.0.70

# 设置 external.rotation 为 same-same
external.rotation: same-same

# 客户端认证方式
clientmethod: none
socksmethod: username

# 允许规则
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    protocol: tcp udp
    log: connect error
}
